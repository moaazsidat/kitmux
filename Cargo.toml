[package]
name = "kit"
version = "0.1.0"
edition = "2024"
description = "Save and restore kitty tabs, layouts, and the coding-agent sessions running in them"
license = "MIT"
repository = "https://github.com/moaazsidat/kit"
readme = "README.md"
keywords = ["kitty", "terminal", "session", "claude", "restore"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
